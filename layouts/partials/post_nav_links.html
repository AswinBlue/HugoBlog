{{- $pages := where site.RegularPages "Type" "in" site.Params.mainSections }}
{{- if and (gt (len $pages) 1) (in $pages . ) }}
<nav class="post-nav-wrapper" aria-label="이전 및 다음 글 네비게이션">
  {{- with $pages.Next . }}
  <a class="nav-card prev-card" href="{{ .Permalink }}" title="{{ .Title }}">
    <div class="nav-subtext">
      <span class="nav-arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </span>
      <span>이전 글 (PREVIOUS)</span>
    </div>
    <div class="nav-title">{{ .Title }}</div>
  </a>
  {{- else }}
  <div class="nav-card-placeholder"></div>
  {{- end }}

  {{- with $pages.Prev . }}
  <a class="nav-card next-card" href="{{ .Permalink }}" title="{{ .Title }}">
    <div class="nav-subtext">
      <span>다음 글 (NEXT)</span>
      <span class="nav-arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </span>
    </div>
    <div class="nav-title">{{ .Title }}</div>
  </a>
  {{- else }}
  <div class="nav-card-placeholder"></div>
  {{- end }}
</nav>
{{- end }}
